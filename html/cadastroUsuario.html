<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <main class="cadastro-usuario">
        <div class="formulario-cadastro">
                <h1>CADASTRO</h1>

                <label for="preencher_nome" class="preencher">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" placeholder="Nome Usuário" id="preencher_nome">
                </label>

                <label for="email" class="preencher">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" placeholder="E-mail" id="email">
                </label>

                <label for="preencher_senha" class="preencher">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" placeholder="Senha" id="preencher_senha">
                </label>

                <label for="confirmar_senha" class="preencher">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" placeholder="Confirmar senha" id="confimar_senha">
                </label>

                <input type="submit" class="botao-enviar-formulario" value="CRIAR CONTA">

                <p>Já tem uma conta? <a href="loginUsuario.html">Clique para fazer o login</a></p>
            </div>
    </main>

    <script src="https://kit.fontawesome.com/bf19b5ff3e.js" crossorigin="anonymous"></script>
</body>
</html>
